<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>登录 · Free AI Hub</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <main class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark">F</div>
        <div>
          <div class="login-eyebrow">FREE AI HUB</div>
          <h1>网关看板</h1>
        </div>
      </div>
      <p class="login-copy">输入面板密码后进入。默认密码为 <code>admin</code>，登录后可在「设置」中修改。</p>
      <form method="post" action="/login" class="login-form">
        <label class="field-label" for="loginPassword">面板密码</label>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" autofocus required placeholder="请输入密码">
        <div id="loginError" class="login-error hidden">密码错误，请重试。</div>
        <button type="submit" class="btn primary login-submit">进入看板</button>
      </form>
      <div class="login-foot">API 使用 <code>/v1</code> 与独立 API Key；看板密码只用于本页面。</div>
      <a class="login-github" href="https://github.com/whortle/free-ai-hub" target="_blank" rel="noopener noreferrer" aria-label="GitHub 仓库">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .7C5.7.7.7 5.7.7 12c0 5 3.2 9.2 7.7 10.7.6.1.8-.3.8-.6v-2.1c-3.1.7-3.8-1.3-3.8-1.3-.5-1.3-1.3-1.6-1.3-1.6-1-.7.1-.7.1-.7 1.1.1 1.7 1.1 1.7 1.1 1 1.7 2.6 1.2 3.2.9.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.2-5.1-5.5 0-1.2.4-2.2 1.1-3-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 3 1.1a10.4 10.4 0 0 1 5.5 0c2.1-1.4 3-1.1 3-1.1.6 1.5.2 2.6.1 2.9.7.8 1.1 1.8 1.1 3 0 4.3-2.6 5.2-5.1 5.5.4.3.8 1 .8 2.1v3.1c0 .3.2.7.8.6 4.5-1.5 7.7-5.7 7.7-10.7C23.3 5.7 18.3.7 12 .7z"/></svg>
        GitHub
      </a>
    </div>
  </main>
  <script>
    if (new URLSearchParams(location.search).get("error")) {
      document.getElementById("loginError").classList.remove("hidden");
      document.getElementById("loginPassword").focus();
    }
  </script>
</body>
</html>
